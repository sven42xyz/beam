<!doctype html>
<!--
  Vorlage für die Vorschaubilder (Open Graph, 1200×630).
  Rendern: npm run og  → public/og-de.png, public/og-en.png
  Sprache per Query: og.html?lang=en
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0f1220;
        --surface: #171b2e;
        --surface-2: #20253c;
        --border: #2a3050;
        --text: #e9ecf8;
        --muted: #8a91ad;
        --accent: #8ea2ff;
        --accent-ink: #0f1220;
        --spark: #ffc857;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .wordmark {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 40px 0 0;
        font-size: 68px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      h1 span {
        color: var(--accent);
      }
      .scene {
        position: absolute;
        right: 40px;
        bottom: 46px;
        width: 780px;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 62px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="64" height="64">
          <rect x="0.5" y="0.5" width="31" height="31" rx="9" fill="#171b2e" stroke="#2a3050"></rect>
          <g stroke="#8ea2ff" stroke-linecap="round" stroke-width="2.4">
            <path d="M7.5 11.5H15" opacity="0.55"></path>
            <path d="M4.5 16H17.5"></path>
            <path d="M7.5 20.5H15" opacity="0.55"></path>
          </g>
          <circle cx="22.5" cy="16" r="4.6" fill="#ffc857"></circle>
        </svg>
        <span class="wordmark">tee</span>
      </div>

      <h1 id="headline"></h1>

      <!-- Standbild der Animation: Datei unterwegs, Kopie schon angekommen -->
      <svg class="scene" viewBox="0 0 640 150">
        <defs>
          <radialGradient id="glow">
            <stop offset="0" stop-color="#ffc857" stop-opacity="0.9"></stop>
            <stop offset="1" stop-color="#ffc857" stop-opacity="0"></stop>
          </radialGradient>
          <symbol id="file" viewBox="-1 -1 28 34">
            <path d="M3 1h13l9 9v18a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3V4a3 3 0 0 1 3-3z" fill="#20253c" stroke="#8ea2ff" stroke-width="1.6"></path>
            <path d="M16 1v6a3 3 0 0 0 3 3h6" fill="none" stroke="#8ea2ff" stroke-width="1.6"></path>
            <path d="M6 17h13M6 22h9" stroke="#8a91ad" stroke-width="1.6" stroke-linecap="round"></path>
          </symbol>
        </defs>
        <!-- Spur zuerst: verschwindet hinter den gefüllten Bildschirmen -->
        <path d="M90 70 Q310 -30 530 73" fill="none" stroke="#8ea2ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"></path>
        <g fill="none" stroke="#3a4168" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
          <rect x="62" y="24" width="56" height="102" rx="11" fill="#0f1220"></rect>
          <path d="M82 31h16"></path>
          <rect x="476" y="38" width="108" height="70" rx="7" fill="#171b2e"></rect>
          <path d="M456 114h148l-8 9H464z"></path>
        </g>
        <use href="#file" x="76" y="53" width="28" height="34" opacity="0.4"></use>
        <circle cx="420" cy="34" r="16" fill="url(#glow)"></circle>
        <circle cx="420" cy="34" r="5" fill="#ffc857"></circle>
        <use href="#file" x="516" y="56" width="28" height="34"></use>
        <circle cx="545" cy="86" r="8" fill="#8ea2ff"></circle>
        <path d="M541.5 86l2.5 2.5 4.5-5" fill="none" stroke="#0f1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>

      <div class="url">tee.chapter42.de</div>
    </div>

    <script>
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'de';
      const text = {
        de: ['Vom einen Gerät aufs andere.', 'In Sekunden.'],
        en: ['From one device to another.', 'In seconds.'],
      }[lang];
      document.documentElement.lang = lang;
      document.getElementById('headline').innerHTML = `${text[0]}<br /><span>${text[1]}</span>`;
    </script>
  </body>
</html>
